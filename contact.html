<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="OSAKA BAR GUIDEへのお問い合わせ。店舗情報の修正依頼や掲載に関するご相談はこちら。">
<title>お問い合わせ｜OSAKA BAR GUIDE</title>
<link rel="stylesheet" href="style.css?v=20261107-photo-unified">
<style>
.contact-hero{background:linear-gradient(125deg,#0a0c17,#2c1b30 70%,#0d0c16);color:white;padding:46px 0}
.contact-hero h1{font-size:clamp(26px,4vw,36px);margin:8px 0}
.contact-hero p{font-size:14px;color:#ddd3df;margin:0}
.contact-main{background:var(--bg);padding:48px 0 65px}
.contact-card{max-width:680px;margin:auto;padding:32px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #1d16300a}
.contact-card h2{font-size:20px;margin:0 0 8px}
.contact-intro{color:var(--muted);font-size:14px;margin:0 0 26px}
.contact-field{margin-bottom:22px}
.contact-field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.contact-field input,.contact-field textarea{display:block;width:100%;border:1px solid #d6d5df;border-radius:7px;padding:12px 14px;font:inherit;font-size:16px;background:#f7f6f8}
.contact-field input:disabled,.contact-field textarea:disabled{opacity:1;color:#777}
.contact-field textarea{min-height:155px;resize:vertical}
.contact-submit{width:100%;border:0;border-radius:7px;padding:15px;font:700 15px "Noto Sans JP",sans-serif;background:#a5a2ab;color:white;cursor:not-allowed}
.contact-notice{font-size:13px;color:#665b65;background:#f8f1f5;border-left:3px solid var(--pink);padding:12px 14px;margin:18px 0;border-radius:4px}
.contact-back{display:inline-block;margin-top:15px;font-size:14px;font-weight:700;color:#a82e68;text-decoration:underline;text-underline-offset:3px}
@media(max-width:700px){.contact-hero{padding:34px 0}.contact-main{padding:30px 0 50px}.contact-card{padding:22px 18px}}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a class="logo" href="index.html#contents">OSAKA <span>BAR GUIDE</span></a></div></header>
<section class="contact-hero"><div class="container"><span class="eyebrow" style="color:var(--gold)">CONTACT</span><h1>お問い合わせ</h1><p>OSAKA BAR GUIDEへのご連絡はこちらから</p></div></section>
<main class="contact-main"><div class="container"><div class="contact-card">
<h2>お問い合わせフォーム</h2>
<p class="contact-intro">店舗情報の修正依頼や掲載に関するご相談など、お問い合わせ内容をご入力ください。</p>
<form aria-label="お問い合わせフォーム（準備中）">
<div class="contact-field"><label for="name">お名前（任意）</label><input id="name" name="name" type="text" placeholder="お名前" disabled></div>
<div class="contact-field"><label for="email">メールアドレス</label><input id="email" name="email" type="email" placeholder="example@email.com" disabled></div>
<div class="contact-field"><label for="message">お問い合わせ内容</label><textarea id="message" name="message" placeholder="お問い合わせ内容をご入力ください" disabled></textarea></div>
<button class="contact-submit" type="button" disabled>送信する（準備中）</button>
</form>
<p class="contact-notice">現在、お問い合わせフォームの送信機能を準備中です。入力・送信はまだできません。</p>
<a class="contact-back" href="index.html">← トップページへ戻る</a>
</div></div></main>
<footer class="footer"><div class="container"><strong>OSAKA BAR GUIDE</strong><p>掲載内容は確認時点の情報です。料金・営業時間・入店条件は変更される場合があります。ご来店前に各店舗の公式案内をご確認ください。</p></div></footer>
</body>
</html>
